name: Bug report
description: Something does not work as expected
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste real workspace content** (stakeholder names, notes, deliverables). Use made-up data.
        Security issues go through the [security policy](https://github.com/geovanneb/get-things-done/security/policy), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. gtd init ...
        2. gtd start
        3. Open the Board and ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `gtd --version`
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: Node 22.11, macOS 15
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [CLI, Dashboard UI, Server / API, AI agent templates, Workspace files, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: The server log is at `.situation-board/logs/server.log` in your workspace. Remove anything private first.
      render: text
