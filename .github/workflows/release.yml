name: Release

# Runs when a maintainer pushes a version tag, e.g. `git tag v0.2.0 && git push origin v0.2.0`.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"
            exit 1
          fi
      - run: npm run build
      - run: npm test

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protected environment: add required reviewers in Settings > Environments > npm
    # so nothing reaches npm without a human approving it.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@bertonha/getthingsdone
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11, which supports trusted publishing without a token.
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Skip versions that are already on npm
        id: check
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published, skipping."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.check.outputs.published != 'true'
        run: npm publish --provenance --access public --ignore-scripts
        env:
          # Only used until trusted publishing is configured on npmjs.com.
          # After that, delete the NPM_TOKEN secret: the OIDC token is used instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub release
    needs: [publish, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Extract this version's notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::No CHANGELOG.md entry for $VERSION, using generated notes only."
          fi
      - name: Explain an unsigned Windows preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The desktop job attaches the Windows installer unsigned while Windows signing is not set up.
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' 2>/dev/null | grep -q -- '-unsigned-preview\.exe$'; then
            {
              echo
              echo '### Windows: preview installer'
              echo
              echo 'The Windows installer is not signed yet, so Windows SmartScreen shows "Windows protected your PC".'
              echo 'Choose **More info**, then **Run anyway**. This version does not update itself; download the next one from this page.'
              echo 'The Mac installers are signed and notarized by Apple.'
            } >> notes.md
          fi
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --draft=false
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes --verify-tag
          fi

  desktop:
    name: Release desktop installers
    needs: verify
    permissions:
      contents: write
    uses: ./.github/workflows/desktop.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit
