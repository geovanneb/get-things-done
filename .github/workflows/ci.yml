name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. Pull requests from forks never get write access or secrets.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 20.19.0 is the floor in package.json engines: the CLI require()s ESM-only
        # packages (chalk, ora, open), which older Node versions cannot load.
        node: ['20.19.0', '22', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint
        # Same result on every Node version, so it runs once.
        if: matrix.node == '22'
        run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Verify the tarball contents
        # --ignore-scripts: the build already ran. Without it npm pack runs the
        # lifecycle scripts again and their output corrupts the JSON on stdout.
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map(f => f.path);
            const leaked = files.filter(f =>
              f.startsWith('executive-workspace/') ||
              f.startsWith('scripts/') ||
              f.startsWith('desktop/') ||
              f.includes('node_modules/') ||
              f.endsWith('.DS_Store')
            );
            if (leaked.length) {
              console.error('Files that must not ship:', leaked);
              process.exit(1);
            }
            for (const required of ['bin/gtd.js', 'dist/cli/index.js', 'dist/server/index.js', 'dist/server/services/scaffold.js', 'dist/ui/index.html', 'templates/workspace/gitignore']) {
              if (!files.includes(required)) {
                console.error('Missing from tarball:', required);
                process.exit(1);
              }
            }
            console.log('Tarball OK:', files.length, 'files');
          "

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reject high or critical production advisories
        run: npm audit --omit=dev --audit-level=high

  desktop:
    name: Desktop shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Type-checking needs Electron's types, not its ~100 MB binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      - run: npm run build --prefix desktop
      # Electron is a dev dependency of the package but ships inside the app, so every advisory counts.
      - name: Reject high or critical advisories
        run: npm audit --prefix desktop --audit-level=high
