name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. Pull requests from forks never get write access or secrets.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 20.19.0 is the floor in package.json engines: the CLI require()s ESM-only
        # packages (chalk, ora, open), which older Node versions cannot load.
        node: ['20.19.0', '22', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint
        # Same result on every Node version, so it runs once.
        if: matrix.node == '22'
        run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Verify the tarball contents
        # --ignore-scripts: the build already ran. Without it npm pack runs the
        # lifecycle scripts again and their output corrupts the JSON on stdout.
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map(f => f.path);
            const leaked = files.filter(f =>
              f.startsWith('executive-workspace/') ||
              f.startsWith('scripts/') ||
              f.startsWith('desktop/') ||
              f.includes('node_modules/') ||
              f.endsWith('.DS_Store')
            );
            if (leaked.length) {
              console.error('Files that must not ship:', leaked);
              process.exit(1);
            }
            for (const required of ['bin/gtd.js', 'dist/cli/index.js', 'dist/server/index.js', 'dist/server/services/scaffold.js', 'dist/server/services/transcription/worker.js', 'dist/ui/index.html', 'templates/workspace/gitignore']) {
              if (!files.includes(required)) {
                console.error('Missing from tarball:', required);
                process.exit(1);
              }
            }
            console.log('Tarball OK:', files.length, 'files');
          "

  transcription:
    name: Transcription (real model)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Every run, not only on a cache miss: the app's own downloader fetches SenseVoice (240 MB) and the
      # voice-activity model from their pinned addresses and checks every byte, as Settings does.
      - name: Download the test model with the app's downloader
        env:
          ESB_MODELS_PATH: ${{ runner.temp }}/models
        run: |
          node -e "
            const { TranscriptionModelService } = require('./dist/server/services/transcriptionModels.js');
            const service = new TranscriptionModelService();
            (async () => {
              await service.download('sensevoice-2024-07-17');
              await TranscriptionModelService.settled();
              const model = (await service.view()).models.find((m) => m.id === 'sensevoice-2024-07-17');
              if (!model.installed || !(await service.installed('silero-vad'))) { console.error(model.download); process.exit(1); }
              console.log('Model installed and verified');
            })();
          "
      # Two short samples that come with the model, pinned by commit and checksum; downloaded, never committed.
      - name: Download the sample recordings
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audio"
          base=https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/2365baeacb507f821a0c8120fcee3d484dba7a07/test_wavs
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/audio/en.wav" "$base/en.wav"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/audio/ja.wav" "$base/ja.wav"
          cd "$RUNNER_TEMP/audio"
          echo "eb1eb008904465b74c304aad8342e8c7d3c6e61ffe9f66adcaca9cf0f76a93f4  en.wav" | sha256sum -c -
          echo "460bd8dccb0d2a5f4e29c628f837be4082d13defc64c3fc21dd1b6bb0e119095  ja.wav" | sha256sum -c -
      - name: Transcribe them in the worker
        working-directory: server
        env:
          STT_TEST_MODELS: ${{ runner.temp }}/models
          STT_TEST_AUDIO: ${{ runner.temp }}/audio
        run: node --import tsx --test --test-concurrency=1 --test-name-pattern="real model" tests/transcription-engine.test.ts tests/meeting-acceptance.test.ts

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reject high or critical production advisories
        run: npm audit --omit=dev --audit-level=high

  desktop:
    name: Desktop shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Type-checking needs Electron's types, not its ~100 MB binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      - run: npm run build --prefix desktop
      # Electron is a dev dependency of the package but ships inside the app, so every advisory counts.
      - name: Reject high or critical advisories
        run: npm audit --prefix desktop --audit-level=high
