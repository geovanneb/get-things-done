version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      # chalk 6 requires Node 22+, above the current engines floor (20.19).
      # Remove this when the minimum Node version moves to 22.
      - dependency-name: chalk
        update-types: [version-update:semver-major]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor:
        dependency-type: production
        update-types: [minor, patch]
  # The desktop app has its own lockfile, so the web and CLI install never downloads Electron.
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
